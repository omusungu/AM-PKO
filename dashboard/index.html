<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AM-PKO Architecture Dashboard">
  <title>AM-PKO Architecture Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
  <header>
    <h1>AM-PKO Architecture Dashboard</h1>
    <p>Albert Musungu Personal Knowledge Operating System</p>
  </header>

  <main>
    <section>
      <h2>Architecture Pipeline</h2>
      <div class="pipeline">
        <span class="pipeline-step">Capture</span>
        <span class="pipeline-arrow">→</span>
        <span class="pipeline-step">Structure</span>
        <span class="pipeline-arrow">→</span>
        <span class="pipeline-step">Connect</span>
        <span class="pipeline-arrow">→</span>
        <span class="pipeline-step">Embed</span>
        <span class="pipeline-arrow">→</span>
        <span class="pipeline-step">Retrieve</span>
        <span class="pipeline-arrow">→</span>
        <span class="pipeline-step">Reason</span>
        <span class="pipeline-arrow">→</span>
        <span class="pipeline-step">Apply</span>
      </div>
    </section>

    <section>
      <h2>Knowledge Records</h2>
      <div id="records-container"></div>
    </section>

    <section>
      <h2>Relationships</h2>
      <div id="relationships-container"></div>
    </section>

    <section>
      <h2>Modules</h2>
      <div id="modules-container"></div>
    </section>

    <section>
      <h2>Experiments</h2>
      <div id="experiments-container"></div>
    </section>
  </main>

  <footer>
    <p>AM-PKO</p>
  </footer>

  <script src="js/records.js"></script>
  <script src="js/relationships.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/experiments.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
